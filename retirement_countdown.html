<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 50px; }
  #clock { font-size: 2em; font-weight: bold; }
</style>
</head>
<body>

<h1>Time to Retire in...</h1>
<div id="clock"></div>

<script>
// Set the target date: July 1, 2026 00:00:00
const targetDate = new Date("July 1, 2026 00:00:00").getTime();

const timer = setInterval(function() {
  const now = new Date().getTime();
  const distance = targetDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("clock").innerHTML = days + " Days " + hours + " Hrs " 
  + minutes + " Mins " + seconds + " Secs ";

  if (distance < 0) {
    clearInterval(timer);
    document.getElementById("clock").innerHTML = "Happy Retirement!";
  }
}, 1000);
</script>

</body>
</html>
